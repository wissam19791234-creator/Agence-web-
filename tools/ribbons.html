<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Rendu des rubans 3D — Scalify</title>
  <style>html, body { margin: 0; background: #dceeff; }</style>
</head>
<body>
  <!-- Page utilisée uniquement pour générer les rubans 3D (scripts/render-ribbons.mjs) -->
  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';

    const V = (x, y, z) => new THREE.Vector3(x, y, z);

    // Chaque variante : taille de l'image, caméra, tracé du ruban, rayon, portion « devant le texte »
    const VARIANTS = {
      hero: {
        w: 2400, h: 1100, fov: 30, cam: [0, 0, 22], radius: 0.82,
        points: [V(-15, -3.2, -2), V(-9.5, -1.5, -1), V(-6.5, 2.9, -2.5), V(-3.2, 3.6, -1.5), V(-1.8, 0.4, 1.2), V(-3.8, -2.6, 2.4), V(-6.4, -1.2, 1.4), V(-4.8, 1.4, -0.6), V(0.5, 1.2, -2.8), V(5.5, -2.6, -1.2), V(8.2, -1.8, 0.8), V(9.6, 1.9, 1.6), V(12.6, 3.4, 0.2), V(16, 2.2, -1)],
        front: [0.36, 0.42],
      },
      arc: {
        w: 1800, h: 900, fov: 30, cam: [0, 0, 20], radius: 0.85,
        points: [V(-13, 3.8, -1), V(-7, 5.2, 0), V(-2, 2.6, 1.5), V(1.6, -1.6, 0.5), V(5, -3.8, -1), V(9.5, -2.2, 0.2), V(13, 1.2, 1)],
      },
      s: {
        w: 1200, h: 1200, fov: 28, cam: [0, 0, 24], radius: 0.95, tilt: [0.22, -0.35, 0.08],
        points: [V(3.3, 3.9, -0.6), V(1.6, 4.6, 0.2), V(-1.2, 4.5, 0.6), V(-3.2, 3.0, 0.3), V(-3.0, 0.9, -0.3), V(-1.0, -0.1, 0), V(1.4, -0.4, 0.3), V(3.2, -1.8, 0.4), V(3.1, -3.9, -0.2), V(0.6, -4.8, -0.4), V(-2.3, -4.4, 0), V(-3.8, -3.3, 0.5)],
        caps: true,
      },
      wave: {
        w: 2400, h: 700, fov: 26, cam: [0, 0, 24], radius: 0.72, caps: true,
        points: [V(-16, 0.6, 0), V(-11, -2.4, 1), V(-6, 1.8, -1), V(-1, -1.9, 1), V(4, 2.0, -1), V(9, -1.6, 1), V(16, 1.2, 0)],
      },
      loop: {
        w: 1200, h: 1200, fov: 28, cam: [0, 0, 21], radius: 0.78, tilt: [0.35, 0.25, 0.1],
        // Nœud de trèfle gonflable (symbole du « cœur IA »)
        points: Array.from({ length: 240 }, (_, i) => {
          const t = (i / 240) * Math.PI * 2;
          return V((Math.sin(t) + 2 * Math.sin(2 * t)) * 1.45, (Math.cos(t) - 2 * Math.cos(2 * t)) * 1.45, -Math.sin(3 * t) * 1.6);
        }),
        closed: true,
      },
    };

    // Grain : texture de bruit pour le relief et la rugosité (surface « gonflable » granuleuse)
    function noiseTexture(size = 512) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const img = g.createImageData(size, size);
      for (let i = 0; i < size * size; i++) {
        const v = 110 + Math.random() * 145;
        img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
        img.data[i * 4 + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      return t;
    }

    window.renderRibbon = async (name, part = 'full', frontOverride = null) => {
      const v = { ...VARIANTS[name], ...(frontOverride ? { front: frontOverride } : {}) };
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(v.w, v.h);
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.toneMappingExposure = 0.92;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.38;

      const camera = new THREE.PerspectiveCamera(v.fov, v.w / v.h, 0.1, 200);
      camera.position.set(...v.cam);
      camera.lookAt(0, 0, 0);

      const key = new THREE.DirectionalLight(0xffffff, 2.7);
      key.position.set(-7, 10, 9);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xcfe6ff, 1.1);
      rim.position.set(9, -3, 4);
      scene.add(rim);
      scene.add(new THREE.HemisphereLight(0xeaf4ff, 0x0f3f8c, 0.7));

      const grain = noiseTexture();
      grain.repeat.set(90, 5);
      const mat = new THREE.MeshPhysicalMaterial({
        color: 0x3f98ff, roughness: 0.5, metalness: 0,
        clearcoat: 0.55, clearcoatRoughness: 0.28,
        sheen: 0.25, sheenRoughness: 0.7, sheenColor: new THREE.Color(0xbfe0ff),
        bumpMap: grain, bumpScale: 0.3, roughnessMap: grain,
      });

      const curve = new THREE.CatmullRomCurve3(v.points, !!v.closed, 'catmullrom', 0.5);
      const TUB = 900, RAD = 64;
      const geo = new THREE.TubeGeometry(curve, TUB, v.radius, RAD, !!v.closed);
      if (part === 'front' && v.front) {
        const [a, b] = v.front;
        geo.setDrawRange(Math.floor(a * TUB) * RAD * 6, Math.floor((b - a) * TUB) * RAD * 6);
      }
      const group = new THREE.Group();
      group.add(new THREE.Mesh(geo, mat));
      if (v.caps && part === 'full') {
        for (const t of [0, 1]) {
          const cap = new THREE.Mesh(new THREE.SphereGeometry(v.radius, 64, 32), mat);
          cap.position.copy(curve.getPoint(t));
          group.add(cap);
        }
      }
      if (v.tilt) group.rotation.set(...v.tilt);
      scene.add(group);

      renderer.render(scene, camera);

      // Grain d'image léger, uniquement sur le ruban (pixels opaques)
      const out = document.createElement('canvas');
      out.width = v.w; out.height = v.h;
      const g = out.getContext('2d');
      g.drawImage(renderer.domElement, 0, 0);
      const img = g.getImageData(0, 0, v.w, v.h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] === 0) continue;
        const n = (Math.random() - 0.5) * 22;
        d[i] = Math.max(0, Math.min(255, d[i] + n));
        d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
        d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
      }
      g.putImageData(img, 0, 0);
      renderer.dispose();
      renderer.domElement.remove();
      return out.toDataURL('image/png');
    };
    window.ribbonsReady = true;
  </script>
</body>
</html>
