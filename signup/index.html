<!doctype html>
<html lang="fr">
<head>
  <!--@head-->
  <title>Créer votre espace · Scalify</title>
  <meta name="description" content="Créez votre centre de commande Scalify en 2 minutes. Gratuit, sans carte bancaire." />
  <link rel="canonical" href="%SITE_URL%/signup/" />
</head>
<body class="auth">
  <div class="auth-bg" aria-hidden="true">
    <img decoding="async" class="ribbon auth-ribbon" src="/media/ribbon-s.webp" alt="" width="1200" height="1200" />
    <span data-stk="rocket" data-rot="12" data-size="92" class="st st--a"></span>
    <span data-stk="coin" data-rot="-10" data-size="84" class="st st--b"></span>
    <span data-stk="spark" data-rot="8" data-size="70" class="st st--c"></span>
  </div>
  <header class="auth-top">
    <a href="/" aria-label="Scalify, accueil"><!--@logo--></a>
    <div class="ob-progress" data-progress aria-label="Progression">
      <span class="ob-bar"><i data-bar></i></span><span class="mono" data-pct>20 %</span>
    </div>
    <a class="auth-alt" href="/login/"><span>Déjà un compte ?</span><b>Connexion</b></a>
  </header>
  <main class="ob" data-ob aria-live="polite"></main>
  <script type="module" src="/src/onboarding/main.js"></script>
</body>
</html>
